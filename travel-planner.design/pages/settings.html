<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>设置 · 旅行规划助手</title>
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<style type="text/tailwindcss">
@theme inline {
  --color-background: var(--background);
  --color-foreground: var(--foreground);
  --color-card: var(--card);
  --color-card-foreground: var(--card-foreground);
  --color-popover: var(--popover);
  --color-popover-foreground: var(--popover-foreground);
  --color-primary: var(--primary);
  --color-primary-foreground: var(--primary-foreground);
  --color-secondary: var(--secondary);
  --color-secondary-foreground: var(--secondary-foreground);
  --color-muted: var(--muted);
  --color-muted-foreground: var(--muted-foreground);
  --color-accent: var(--accent);
  --color-accent-foreground: var(--accent-foreground);
  --color-destructive: var(--destructive);
  --color-destructive-foreground: var(--destructive-foreground);
  --color-border: var(--border);
  --color-input: var(--input);
  --color-ring: var(--ring);
  --radius-sm: var(--radius-sm);
  --radius-md: var(--radius-md);
  --radius: var(--radius);
  --radius-lg: var(--radius-xl);
  --radius-xl: var(--radius-2xl);
}
@layer base {
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--background);
    color: var(--foreground);
    font-family: var(--font-serif);
    -webkit-font-smoothing: antialiased;
  }
  button, input, textarea { font: inherit; }
}
</style>
<style id="theme-vars">
/* ============================================================
   Design Tokens — Claude Design System
   ============================================================ */
@import url('https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=Newsreader:ital,opsz,wght@0,18..72,300;0,18..72,400;0,18..72,500;1,18..72,400&family=Geist+Mono:wght@400;500&display=swap');

:root {
  /* Primitive scales */
  --brand-50: #eef3ee;
  --brand-100: #dde5df;
  --brand-200: #bfcec3;
  --brand-300: #9ab3a0;
  --brand-400: #6f9478;
  --brand-500: #4a7558;
  --brand-600: #3a6048;
  --brand-700: #2f4e3a;
  --brand-800: #263e2f;
  --brand-900: #1a2a20;

  --text-50: #f6f5f0;
  --text-100: #ece9de;
  --text-200: #dad9d4;
  --text-300: #c2c0b6;
  --text-400: #9b988c;
  --text-500: #6e6d68;
  --text-600: #535146;
  --text-700: #46443b;
  --text-800: #3d3929;
  --text-900: #28261b;

  --bg-50: #ffffff;
  --bg-100: #f5f7f3;
  --bg-200: #eef1ec;
  --bg-300: #e2e7df;
  --bg-400: #d4dbd0;
  --bg-500: #c2cbbf;
  --bg-600: #aab5a6;
  --bg-700: #8e9a8a;
  --bg-800: #6c7868;
  --bg-900: #4a5449;

  --icon-50: #ffffff;
  --icon-100: #dad9d4;
  --icon-200: #c2c0b6;
  --icon-300: #9b988c;
  --icon-400: #6e6d68;
  --icon-500: #535146;
  --icon-600: #46443b;
  --icon-700: #3d3929;
  --icon-800: #28261b;
  --icon-900: #141413;

  --border-50: #eef0ec;
  --border-100: #e3e6e1;
  --border-200: #d5dad2;
  --border-300: #c5ccc2;
  --border-400: #b0b9ad;
  --border-500: #98a295;
  --border-600: #7e887b;
  --border-700: #646e61;
  --border-800: #4a5449;
  --border-900: #323c30;

  --success-50: #e8efe4;
  --success-100: #d6e3d2;
  --success-200: #b7cbb3;
  --success-300: #93b08e;
  --success-400: #70956c;
  --success-500: #557a52;
  --success-600: #446342;
  --success-700: #374f35;
  --success-800: #2c3e2a;
  --success-900: #1f2c1e;

  --error-50: #fcecea;
  --error-100: #f7dedb;
  --error-200: #f3c4bf;
  --error-300: #eb9d96;
  --error-400: #e0716a;
  --error-500: #d64545;
  --error-600: #b83636;
  --error-700: #962c2c;
  --error-800: #732222;
  --error-900: #531818;

  /* Semantic tokens */
  --background: var(--bg-100);
  --card: var(--bg-200);
  --popover: var(--bg-50);
  --muted: var(--bg-300);

  --foreground: var(--text-800);
  --card-foreground: var(--icon-900);
  --popover-foreground: var(--text-900);
  --primary-foreground: #ffffff;
  --secondary-foreground: var(--text-600);
  --muted-foreground: var(--text-500);
  --accent-foreground: var(--text-900);
  --destructive-foreground: #ffffff;
  --success-foreground: #ffffff;

  --primary: var(--brand-500);
  --secondary: #e0e6dd;
  --accent: var(--secondary);
  --input: var(--border-500);
  --ring: var(--brand-500);
  --border: var(--border-300);

  --destructive: var(--error-500);
  --success: var(--success-500);
  --error: var(--error-500);
  --error-foreground: #ffffff;

  --chart-1: #3a6048;
  --chart-2: #7ba388;
  --chart-3: #d3dcc1;
  --chart-4: #c8d8be;
  --chart-5: #557a52;

  --sidebar: #f1f4ef;
  --sidebar-foreground: #3a4039;
  --sidebar-primary: var(--brand-500);
  --sidebar-primary-foreground: #ffffff;
  --sidebar-accent: #e2e7df;
  --sidebar-accent-foreground: #2f3a2e;
  --sidebar-border: var(--border-100);
  --sidebar-ring: #98a295;

  /* Non-color tokens */
  --font-display: Newsreader, Georgia, ui-serif, serif;
  --font-sans: Poppins, ui-sans-serif, system-ui, sans-serif;
  --font-serif: Lora, Georgia, ui-serif, serif;
  --font-mono: Geist Mono, ui-monospace, monospace;

  --spacing: 0.25rem;

  --radius-sm: 8px;
  --radius-md: 12px;
  --radius: 1rem;
  --radius-xl: 20px;
  --radius-2xl: 24px;
  --radius-full: 9999px;

  --shadow-x: 0;
  --shadow-y: 1px;
  --shadow-blur: 3px;
  --shadow-spread: 0px;
  --shadow-opacity: 0.1;
  --shadow-color: #000000;
  --shadow-2xs: 0 1px 3px 0px rgba(0, 0, 0, 0.05);
  --shadow-xs: 0 1px 3px 0px rgba(0, 0, 0, 0.05);
  --shadow-sm: 0 1px 3px 0px rgba(0, 0, 0, 0.1), 0 1px 2px -1px rgba(0, 0, 0, 0.1);
  --shadow: 0 1px 3px 0px rgba(0, 0, 0, 0.1), 0 1px 2px -1px rgba(0, 0, 0, 0.1);
  --shadow-md: 0 1px 3px 0px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.1);
  --shadow-lg: 0 1px 3px 0px rgba(0, 0, 0, 0.1), 0 4px 6px -1px rgba(0, 0, 0, 0.1);
  --shadow-xl: 0 1px 3px 0px rgba(0, 0, 0, 0.1), 0 8px 10px -1px rgba(0, 0, 0, 0.1);
  --shadow-2xl: 0 1px 3px 0px rgba(0, 0, 0, 0.25);

  --tracking-normal: 0em;
}

/* ============================================================
   Reset & Base
   ============================================================ */
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  min-height: 100vh;
  background: var(--background);
  color: var(--foreground);
  font-family: var(--font-sans);
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}
button { font: inherit; cursor: pointer; }

/* ============================================================
   Design System Components — extracted from components.css
   ============================================================ */

/* Badge */
.badge {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 32px;
  padding: 0 calc(var(--spacing) * 3.5);
  border-radius: var(--radius);
  font: 600 12px/1 var(--font-sans);
  letter-spacing: .01em;
  white-space: nowrap;
  transition: transform .16s ease, box-shadow .16s ease, background-color .16s ease, color .16s ease, border-color .16s ease;
}
.badge:hover { transform: translateY(-1px); }
.badge.filled {
  background: var(--primary);
  color: var(--primary-foreground);
  border: 1px solid transparent;
  box-shadow: var(--shadow-xs);
}
.badge.filled:hover { box-shadow: var(--shadow-sm); }
.badge.muted {
  background: var(--muted);
  color: var(--foreground);
  border: 1px solid transparent;
}
.badge.outline {
  background: var(--popover);
  color: var(--foreground);
  border: 1px solid var(--border);
}
.badge.sm {
  min-height: 26px;
  padding: 0 calc(var(--spacing) * 2.5);
  font-size: 11px;
  border-radius: calc(var(--radius) - 2px);
}
.badge.success-filled {
  background: var(--success-500);
  color: var(--success-foreground);
  border: 1px solid transparent;
  box-shadow: var(--shadow-xs);
}
.badge.success-outline {
  background: transparent;
  color: var(--success-600);
  border: 1px solid var(--success-300);
}

/* Button */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 44px;
  padding: 0 18px;
  border: 1px solid transparent;
  border-radius: var(--radius);
  box-shadow: var(--shadow-sm);
  background: transparent;
  color: var(--foreground);
  font: 600 14px/1.1 var(--font-sans);
  white-space: nowrap;
  transition: background-color .16s ease, color .16s ease, border-color .16s ease, box-shadow .16s ease;
}
.btn:hover, .btn:focus-visible { box-shadow: var(--shadow-md); }
.btn:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
.btn:disabled { cursor: not-allowed; box-shadow: none; }
.btn.primary { background: var(--primary); color: var(--primary-foreground); }
.btn.primary:disabled { background: var(--secondary); color: var(--muted-foreground); border-color: var(--border); }
.btn.secondary { background: var(--secondary); color: var(--foreground); border-color: var(--border); }
.btn.secondary:disabled { background: var(--background); color: var(--muted-foreground); border-color: var(--border); }
.btn.ghost { background: transparent; color: var(--foreground); box-shadow: none; }
.btn.ghost:hover, .btn.ghost:focus-visible { background: var(--muted); }
.btn.ghost:disabled { background: transparent; color: var(--muted-foreground); border-color: transparent; }
.btn.sm {
  min-height: 36px;
  padding: 0 14px;
  font-size: 13px;
  border-radius: calc(var(--radius) - 2px);
}

/* Card */
.card {
  width: 100%;
  min-height: 150px;
  display: flex;
  flex-direction: column;
  padding: 18px;
  overflow: hidden;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--popover);
  box-shadow: var(--shadow-sm);
  transition: transform .16s ease, box-shadow .16s ease, border-color .16s ease;
}
.card:hover { transform: translateY(-1px); box-shadow: var(--shadow-lg); }
.card .eyebrow {
  margin: 0 0 10px;
  font: 600 10px/1.2 var(--font-serif);
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--muted-foreground);
}
.card .title {
  margin: 0 0 10px;
  font: 600 21px/1.18 var(--font-sans);
  color: var(--foreground);
}
.card .body {
  margin: 0;
  flex: 1;
  font-size: 14px;
  line-height: 1.6;
  color: var(--secondary-foreground);
}
.card.sunken { background: var(--card); box-shadow: none; }
.card.sunken .body { color: var(--foreground); }
.card.emphasis {
  background: var(--foreground);
  color: var(--background);
  border-color: transparent;
  box-shadow: var(--shadow-xl);
}

/* Icon helper — mask-image approach */
.icon {
  display: inline-block;
  width: 18px;
  height: 18px;
  flex-shrink: 0;
  background: currentColor;
  -webkit-mask-size: contain;
  mask-size: contain;
  -webkit-mask-repeat: no-repeat;
  mask-repeat: no-repeat;
  -webkit-mask-position: center;
  mask-position: center;
}
.icon.sm { width: 14px; height: 14px; }
.icon.lg { width: 20px; height: 20px; }

/* ============================================================
   App Layout
   ============================================================ */
.app {
  display: grid;
  grid-template-columns: 248px minmax(0, 1fr);
  min-height: 100vh;
  min-width: 0;
  align-items: stretch;
}
.app > * { min-width: 0; }

/* ============================================================
   Sidebar
   ============================================================ */
.sidebar {
  background: var(--sidebar);
  border-right: 1px solid var(--sidebar-border);
  padding: calc(var(--spacing) * 6) calc(var(--spacing) * 4);
  width: 248px;
  min-width: 248px;
  height: 100vh;
  display: flex;
  flex-direction: column;
  gap: calc(var(--spacing) * 6);
  position: sticky;
  top: 0;
  overflow-y: auto;
}

.brand {
  display: flex;
  align-items: center;
  gap: calc(var(--spacing) * 3);
}
.brand-mark {
  width: 38px;
  height: 38px;
  border-radius: var(--radius-md);
  background: var(--brand-500);
  color: var(--primary-foreground);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-sans);
  font-weight: 700;
  font-size: 18px;
}
.brand-name {
  font-family: var(--font-display);
  font-weight: 500;
  font-size: 17px;
  color: var(--sidebar-foreground);
}
.brand-sub {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--muted-foreground);
  letter-spacing: 0.04em;
}

.nav-group {
  display: flex;
  flex-direction: column;
  gap: calc(var(--spacing) * 1);
}
.nav-label {
  font-family: var(--font-sans);
  font-size: 10px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.14em;
  color: var(--muted-foreground);
  padding: 0 calc(var(--spacing) * 3);
  margin-bottom: calc(var(--spacing) * 2);
}
.nav-link {
  display: flex;
  align-items: center;
  gap: calc(var(--spacing) * 3);
  width: 100%;
  min-width: 0;
  height: 44px;
  padding: 0 calc(var(--spacing) * 3);
  border: none;
  background: transparent;
  color: var(--sidebar-foreground);
  font-family: var(--font-sans);
  font-size: 14px;
  font-weight: 500;
  border-radius: var(--radius-md);
  cursor: pointer;
  text-align: left;
  transition: background-color .15s ease, color .15s ease;
}
.nav-link:hover { background: var(--sidebar-accent); }
.nav-link.active {
  background: var(--brand-100);
  color: var(--brand-700);
}
.nav-link .nav-icon {
  width: 18px;
  height: 18px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
}

.recent-list {
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.recent-item {
  display: flex;
  flex-direction: column;
  gap: 2px;
  padding: 10px 12px;
  border-radius: var(--radius-md);
  font-size: 13px;
  color: var(--sidebar-foreground);
  cursor: pointer;
  transition: background-color .15s ease;
}
.recent-item:hover { background: var(--sidebar-accent); }
.recent-item-title {
  font-family: var(--font-sans);
  font-weight: 500;
  font-size: 13px;
}
.recent-item-date {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--muted-foreground);
}

.sidebar-foot { margin-top: auto; }
.sidebar-foot .btn { width: 100%; }

/* ============================================================
   Main Column
   ============================================================ */
.main {
  display: flex;
  flex-direction: column;
  min-width: 0;
  width: 100%;
}

/* Topbar */
.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: 72px;
  padding: 0 calc(var(--spacing) * 8);
  border-bottom: 1px solid var(--border);
  background: color-mix(in srgb, var(--background) 86%, transparent);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  position: sticky;
  top: 0;
  z-index: 4;
}
.topbar-left {
  display: flex;
  align-items: center;
  gap: calc(var(--spacing) * 3);
}
.topbar-title {
  font: 600 20px/1.2 var(--font-sans);
  color: var(--foreground);
  margin: 0;
}
.topbar-right {
  display: flex;
  align-items: center;
  gap: calc(var(--spacing) * 3);
}
.user-avatar {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: var(--brand-200);
  color: var(--brand-700);
  display: flex;
  align-items: center;
  justify-content: center;
  font: 600 14px var(--font-sans);
}

/* ============================================================
   Settings Page Layout
   ============================================================ */
.settings-layout {
  display: flex;
  gap: 48px;
  padding: calc(var(--spacing) * 8) calc(var(--spacing) * 8);
  min-height: calc(100vh - 72px);
}

/* Left Settings Navigation */
.settings-nav {
  width: 240px;
  flex-shrink: 0;
  position: sticky;
  top: 0;
  padding-top: 0;
}
.settings-nav-list {
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.settings-nav-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 14px;
  font: 14px var(--font-sans);
  color: var(--foreground);
  cursor: pointer;
  border-radius: var(--radius-md);
  transition: background-color .15s ease, color .15s ease;
}
.settings-nav-item:hover {
  background: var(--muted);
}
.settings-nav-item.active {
  background: var(--brand-100);
  color: var(--brand-700);
  font-weight: 600;
}

/* Right Settings Content */
.settings-content {
  flex: 1;
  max-width: 640px;
  min-width: 0;
  overflow-y: auto;
}

.settings-page-heading {
  font: 600 22px/1.2 var(--font-sans);
  color: var(--foreground);
  margin: 0;
}
.settings-page-subheading {
  font: 14px var(--font-sans);
  color: var(--muted-foreground);
  margin-top: 6px;
}

/* Settings Card */
.settings-card {
  background: var(--popover);
  border: 1px solid var(--border);
  border-radius: var(--radius-xl);
  box-shadow: var(--shadow-xs);
}

/* Profile Card */
.profile-card {
  padding: 28px;
  margin-top: 24px;
}
.profile-row {
  display: flex;
  align-items: center;
  gap: 20px;
}
.profile-avatar {
  width: 72px;
  height: 72px;
  border-radius: 50%;
  background: var(--brand-200);
  color: var(--brand-700);
  display: flex;
  align-items: center;
  justify-content: center;
  font: 700 28px var(--font-sans);
  flex-shrink: 0;
}
.profile-info {
  flex: 1;
  min-width: 0;
}
.profile-name {
  font: 600 18px/1.2 var(--font-sans);
  color: var(--foreground);
  margin: 0;
}
.profile-email {
  font: 13px var(--font-sans);
  color: var(--muted-foreground);
  margin-top: 4px;
}
.profile-badge {
  margin-top: 8px;
}

/* Form Card */
.form-card {
  padding: 28px;
  margin-top: 20px;
}
.form-card-header {
  margin-bottom: 0;
}
.form-card-title {
  font: 600 15px var(--font-sans);
  color: var(--foreground);
  margin: 0;
}
.form-card-subtitle {
  font: 13px var(--font-sans);
  color: var(--muted-foreground);
  margin-top: 4px;
}
.form-fields {
  margin-top: 20px;
  display: grid;
  gap: 18px;
}
.form-field {
  display: flex;
  flex-direction: column;
}
.form-field label {
  font: 500 13px var(--font-sans);
  color: var(--foreground);
  margin-bottom: 6px;
}
.form-field input,
.form-field select {
  height: 44px;
  padding: 0 14px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--background);
  font: 14px var(--font-sans);
  color: var(--foreground);
  transition: border-color .15s ease, box-shadow .15s ease;
}
.form-field input:hover,
.form-field select:hover {
  border-color: var(--border-400);
}
.form-field input:focus,
.form-field select:focus {
  border-color: var(--ring);
  box-shadow: var(--shadow-sm);
  outline: none;
}
.form-field input:disabled {
  background: var(--card);
  color: var(--muted-foreground);
  cursor: not-allowed;
}
.form-grid-2 {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 18px;
}

/* Preference teaser card */
.pref-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius-xl);
  padding: 24px;
  margin-top: 20px;
}
.pref-card-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.pref-card-title {
  font: 600 15px var(--font-sans);
  color: var(--foreground);
  margin: 0;
}
.pref-card-link {
  font: 500 13px var(--font-sans);
  color: var(--brand-600);
  cursor: pointer;
}
.pref-tags {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-top: 14px;
}
.pref-description {
  font: 13px var(--font-sans);
  color: var(--muted-foreground);
  margin-top: 12px;
}

/* Save Button Bar */
.save-bar {
  position: sticky;
  bottom: 0;
  padding-top: 32px;
  display: flex;
  justify-content: flex-end;
  gap: 12px;
  background: linear-gradient(to bottom, transparent, var(--background) 20px);
  padding-bottom: 8px;
}

/* ============================================================

   ============================================================ */
::-webkit-scrollbar {
  width: 6px;
  height: 6px;
}
::-webkit-scrollbar-track {
  background: transparent;
}
::-webkit-scrollbar-thumb {
  background: var(--border-300);
  border-radius: 3px;
}
::-webkit-scrollbar-thumb:hover {
  background: var(--border-400);
}
</style>
</head>

<div class="app" data-viewport-mode="app-shell">
